# ==============================================================
# ML Feature Store — Prometheus Configuration
# ==============================================================
# Prometheus is a time-series database that periodically scrapes
# HTTP endpoints for metrics and stores them for querying.
#
# How it works with this system:
#   1. FastAPI exposes GET /metrics (Prometheus text format)
#   2. Prometheus scrapes it every 15 seconds
#   3. Grafana queries Prometheus with PromQL to draw dashboards
#
# Metrics collected from the API:
#   - request_count_total            (counter) — total API calls
#   - prediction_latency_seconds     (histogram) — response times
#   - fraud_detection_rate           (gauge) — % transactions flagged
#   - cache_hit_rate                 (gauge) — % served from Redis
#   - Python process metrics (auto)  — CPU, memory, GC stats
# ==============================================================

global:
  # Default scrape interval — how often to collect metrics from targets
  # 15s is the standard for most production setups
  scrape_interval: 15s

  # Timeout for each individual scrape request
  scrape_timeout: 10s

  # How often to evaluate alerting rules (not configured here but good practice)
  evaluation_interval: 15s

  # Labels added to every time-series scraped by this Prometheus instance.
  # Useful when federating multiple Prometheus servers.
  external_labels:
    environment: "development"
    project:     "fraud-detection-feature-store"


# ==============================================================
# Scrape Configurations
# Each job defines one set of targets to scrape.
# ==============================================================
scrape_configs:

  # ── Job 1: FastAPI Fraud Detection API ───────────────────────
  # Scrapes the /metrics endpoint on the API container.
  # The 'api' hostname resolves inside Docker's fraud-network.
  - job_name: "fraud_detection_api"

    # Override the global interval for this job (same here, explicit is clearer)
    scrape_interval: 15s
    scrape_timeout:  10s

    # The path where metrics are exposed (FastAPI /metrics endpoint)
    metrics_path: /metrics

    # HTTP scheme (use https if TLS is configured)
    scheme: http

    static_configs:
      - targets:
          - "api:8000"    # hostname:port inside Docker network

        # Labels attached to every metric scraped from these targets.
        # Visible in Grafana as filter dimensions.
        labels:
          service:     "fraud-api"
          component:   "prediction-engine"
          environment: "development"

  # ── Job 2: Prometheus self-monitoring ────────────────────────
  # Prometheus scrapes itself to expose its own internal metrics
  # (scrape duration, sample count, memory usage, etc.)
  # Useful for alerting if Prometheus itself is unhealthy.
  - job_name: "prometheus"

    scrape_interval: 30s    # Less frequent — internal metrics change slowly

    static_configs:
      - targets:
          - "localhost:9090"

        labels:
          service: "prometheus"
